name: WK5-Fraud-Detection-CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # We install dependencies from your requirements.txt
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure core ML libraries are present for testing
        pip install scikit-learn imbalanced-learn pandas numpy

    - name: Run Tests
      run: |
        # This will run any tests you write in the tests/ folder
        python -m unittest discover tests